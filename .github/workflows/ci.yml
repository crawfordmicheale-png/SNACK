name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and play
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm run verify` drives the built game in a real browser, so Chromium
      # has to be present before it runs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the bundle, serves it, plays a scripted run, and audits every
      # map for reachability. Fails on console errors or missed assertions.
      - name: Build and smoke test
        run: npm run verify

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: scripts/shots/
          if-no-files-found: ignore
          retention-days: 7
